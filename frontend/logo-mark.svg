<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sirius Pulse logo mark</title>
  <desc id="desc">A silver compass star with an electric blue pulse line through the center.</desc>
  <defs>
    <linearGradient id="silver" x1="20" y1="14" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#C9D1DC"/>
      <stop offset="0.58" stop-color="#778499"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="20" y1="48" x2="76" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8EFF"/>
      <stop offset="0.48" stop-color="#8EC6FF"/>
      <stop offset="1" stop-color="#2E6BFF"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.43 0 0 0 0 1 0 0 0 0.48 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="32" stroke="url(#silver)" stroke-width="3.5"/>
  <path d="M48 10L55.5 39.5L86 48L55.5 56.5L48 86L40.5 56.5L10 48L40.5 39.5L48 10Z" stroke="url(#silver)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M20 51H34L39 42L46 61L53 33L59 51H76" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <circle cx="48" cy="48" r="5" fill="url(#blue)"/>
</svg>
